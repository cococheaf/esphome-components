esphome:
  name: wmbus-water-meter
  friendly_name: Water Meter

esp8266:
  board: d1_mini

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: github://cococheaf/esphome-components@v5-esp8266.3
    components: [wmbus_radio, wmbus_meter, wmbus_common]

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO15
  irq_pin: GPIO4  # CC1101 GDO2: interrupt as soon as the sync word is seen.
  frequency: 868.95MHz

wmbus_meter:
  - id: water_meter
    meter_id: 0x12345678  # Replace with your own meter ID.
    type: izar

sensor:
  - platform: wmbus_meter
    parent_id: water_meter
    field: total_m3
    name: Water Total
    device_class: water
    state_class: total_increasing
    unit_of_measurement: m³
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: water_meter
    field: rssi_dbm
    name: Water Meter RSSI
    device_class: signal_strength
    state_class: measurement
    unit_of_measurement: dBm
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: water_meter
    field: lqi
    name: Water Meter LQI
    state_class: measurement
    entity_category: diagnostic
